# Linux 首次部署先准备日志目录，保证容器 UID 10001 可以写入：
# sudo mkdir -p /apps/logs/sage-memory
# sudo chown -R 10001:10001 /apps/logs/sage-memory
# mvn -DskipTests package
# docker compose up -d --build
# 注意：当前 JAR 内含 YAML 明文密钥，镜像也必须保持私有。
services:
  sage-memory:
    image: sage-memory
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30m
    # 可根据服务器资源调整；JVM 堆只占容器内存的 60%，为线程、图片和本地内存留余量。
    mem_limit: 2g
    stop_grace_period: 31m
    volumes:
      # 同时持久化 workspace 和 add-state；不要只挂 workspace。
      - memory-data:/app/.sage-memory
      - /apps/logs/sage-memory:/apps/logs/sage-memory
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  memory-data:
